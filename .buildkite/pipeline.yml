# smk { overwrite: true }
# buildq runs this pipeline in place of make ci. Every branch runs make ci on
# the default queue, whose agents hold no credential. A bump-* branch, which
# smk pkg bump pushes, runs it at priority -1, so a fan-out of pin bumps across
# repositories waits behind every other job.
steps:
  - label: "make ci"
    key: ci
    command: make ci
    branches: "!bump-*"
  - label: "make ci, pin bump"
    command: make ci
    branches: "bump-*"
    priority: -1
