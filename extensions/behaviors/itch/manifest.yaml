manifestVersion: 1
name: "@reset/itch"
version: "2026.10.31.1"
license: MIT
description: Push builds to itch.io with butler, and record games and versions.
repository: https://github.com/reset/swamp-extensions
paths:
  base: manifest
behaviors:
  - itch.ts
additionalFiles:
  - README.md
  - LICENSE
# Empty means every platform: butler runs on Linux, macOS and Windows, and
# the API methods need only the network.
platforms: []
labels:
  - itch
  - game-development
  - publishing
  - analytics
  - monitoring
