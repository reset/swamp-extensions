manifestVersion: 1
name: "@reset/steam-achievements"
version: "2026.10.30.1"
license: MIT
description: Sample a Steam app's achievement unlock rates and summarise them.
# The public home of every @reset extension (decided October 20, 2026); the
# quality factor repository-verified credits it once the repository exists.
repository: https://github.com/reset/swamp-extensions
paths:
  base: manifest
behaviors:
  - steam_achievements.ts
additionalFiles:
  - README.md
  - LICENSE
