manifestVersion: 1
name: "@reset/steam-news"
version: "2026.10.30.1"
license: MIT
description: Find a Steam app's release post, and record and list its news.
# The public home of every @reset extension (decided October 20, 2026); the
# quality factor repository-verified credits it once the repository exists.
repository: https://github.com/reset/swamp-extensions
paths:
  base: manifest
behaviors:
  - steam-news.ts
additionalFiles:
  - README.md
  - LICENSE
labels:
  - steam
  - game-development
  - publishing
  - news
  - monitoring
# Empty: the behavior is plain fetch and runs wherever swamp does.
platforms: []
