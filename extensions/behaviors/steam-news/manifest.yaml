manifestVersion: 1
name: "@reset/steam-news"
version: "2026.10.21.1"
license: MIT
description: |-
  Read a Steam app's news through the Steam Web API's GetNewsForApp (or
  GetNewsForAppAuthed with a publisher key): list the newest posts by feed,
  and check that a post naming a release's version went out since a date,
  each written as a resource a workflow can assert on.
repository: https://github.com/reset/swamp-extensions
paths:
  base: manifest
behaviors:
  - steam-news.ts
additionalFiles:
  - README.md
  - LICENSE
labels:
  - steam
  - game-development
  - publishing
# Empty: the behavior is plain fetch and runs wherever swamp does.
platforms: []
