manifestVersion: 1
name: "@reset/steam"
version: "2026.10.24.1"
license: MIT
description: Upload a game's builds to Steam and set them live on a branch.
# The public home of every @reset extension (decided October 20, 2026); the
# quality factor repository-verified credits it once the repository exists.
repository: https://github.com/reset/swamp-extensions
paths:
  base: manifest
behaviors:
  - steam.ts
additionalFiles:
  - README.md
  - LICENSE
# Empty means every platform: steamcmd itself runs on Linux, macOS and
# Windows, and the Web API methods need only the network.
platforms: []
labels:
  - steam
  - game-development
  - publishing
