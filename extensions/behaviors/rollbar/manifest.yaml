manifestVersion: 1
name: "@reset/rollbar"
version: "2026.10.24.1"
license: MIT
description: |-
  Drive a Rollbar-compatible crash-reporting API (api.rollbar.com, or
  crashq with one host change): list and read items, occurrences and
  item events, resolve, mute and assign items, record deploys, and read
  the occurrence, activation and top-item reports, each written as a
  resource a workflow can assert on.
repository: https://github.com/reset/swamp-extensions
paths:
  base: manifest
behaviors:
  - rollbar.ts
additionalFiles:
  - README.md
  - LICENSE
labels:
  - crash-reporting
  - rollbar
  - observability
# Empty: the behavior is plain fetch and runs wherever swamp does.
platforms: []
