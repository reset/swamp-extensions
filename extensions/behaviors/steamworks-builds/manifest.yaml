manifestVersion: 1
name: "@reset/steamworks-builds"
version: "2026.10.30.1"
license: MIT
description: Record a Steam app's branches and builds and how they move.
# The public home of every @reset extension (decided October 20, 2026); the
# quality factor repository-verified credits it once the repository exists.
repository: https://github.com/reset/swamp-extensions
paths:
  base: manifest
behaviors:
  - steamworks_builds.ts
additionalFiles:
  - README.md
  - LICENSE
# Empty means every platform: the behavior only makes HTTPS requests.
platforms: []
labels:
  - steam
  - steamworks
  - builds
  - game-development
  - release
