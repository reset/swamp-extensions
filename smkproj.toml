Features = ["nixshell"]
BootstrapComplete = false
BootstrapOnly = ["src/.*", "public/.*"]
Languages = ["Shell"]
[Ci]
Provider = ""
[Ci.Settings]
[License]
Kind = "MIT"
Holder = "Jamie Stormbreaker"
Year = 2026
[Issue]
Provider = "workq"
Project = "SMK"
