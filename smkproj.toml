Name = "swamp-extensions"
Description = "Swamp Club workspace, workflows and extension sources for SMK's game-development vertical"
MasterBranch = "main"
BaseDir = "."
Domain = ""
UnityProject = ""
Namespace = ""
Owner = "smk"
